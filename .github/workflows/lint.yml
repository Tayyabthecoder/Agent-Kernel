name: lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/lint.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ui-ux-pro-max data
        run: python .agents/skills/ui-ux-pro-max/scripts/validate_data.py
      - name: Smoke-test ui-ux-pro-max search
        run: python .agents/skills/ui-ux-pro-max/scripts/search.py "saas dashboard" --domain style
